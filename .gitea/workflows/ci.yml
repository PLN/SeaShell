name: CI

# Branch pushes only: a tag push starts no run and consumes no VERSION_COUNTER
# value. tool/release.cs (workspace repo) reads this block to decide that the
# release tag can be pushed together with master: keep a non-empty `branches`
# filter and no `tags` / `tags-ignore`.
on:
  push:
    branches:
      - '**'

defaults:
  run:
    shell: bash

# ── Build ───────────────────────────────────────────────────────────────
# Compile on all platforms, produce platform-specific binaries.

jobs:
  version:
    runs-on: linux-x64
    outputs:
      counter: ${{ steps.bump.outputs.COUNTER }}
      version: ${{ steps.bump.outputs.VERSION }}
    steps:
      - uses: http://gitea:3000/actions/checkout@v4

      - name: Bump version counter
        id: bump

        run: |
          # Read current counter from Gitea variable
          CURRENT=${{ vars.VERSION_COUNTER }}
          NEXT=$((CURRENT + 1))

          # Update the variable via API
          curl -s -X PUT \
            -H "Authorization: token ${{ secrets.API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"name\":\"VERSION_COUNTER\",\"value\":\"$NEXT\"}" \
            "${{ github.server_url }}/api/v1/repos/${{ github.repository }}/actions/variables/VERSION_COUNTER"

          # Read base version from Directory.Build.props (e.g. 0.4.0.142 → 0.4.0)
          BASE=$(grep -oP '<Version>\K[^<]+' Directory.Build.props | sed 's/\.[0-9]*$//')
          VERSION="$BASE.$NEXT"

          echo "COUNTER=$NEXT" >> $GITHUB_OUTPUT
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION (counter: $NEXT)"

  build:
    needs: version
    strategy:
      matrix:
        include:
          - runner: win-x64
            rid: win-x64
            os: windows
          - runner: linux-x64
            rid: linux-x64
            os: linux
          - runner: linux-musl-x64
            rid: linux-musl-x64
            os: linux
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: http://gitea:3000/actions/checkout@v4

      - name: Set version

        run: |
          VERSION="${{ needs.version.outputs.version }}"
          sed -i "s|<Version>[^<]*</Version>|<Version>$VERSION</Version>|" Directory.Build.props
          echo "Building version $VERSION"

      - name: Build
        run: dotnet build -c Release

      - name: Publish Daemon + Elevator
        run: |
          dotnet publish src/SeaShell.Daemon/SeaShell.Daemon.csproj -c Release -r ${{ matrix.rid }} --self-contained false -o ./publish/${{ matrix.rid }}
          dotnet publish src/SeaShell.Elevator/SeaShell.Elevator.csproj -c Release -r ${{ matrix.rid }} --self-contained false -o ./publish/${{ matrix.rid }}

      - name: Publish CLI (sea)
        run: |
          dotnet publish src/SeaShell.Cli/SeaShell.Cli.csproj -c Release -r ${{ matrix.rid }} --self-contained false -o ./publish/cli-tmp

      - name: Merge CLI into publish

        run: cp -f publish/cli-tmp/* publish/${{ matrix.rid }}/ && rm -rf publish/cli-tmp

      - name: Publish seaw (Windows only)
        if: matrix.rid == 'win-x64'
        run: |
          dotnet publish src/SeaShell.Cli/SeaShell.Cli.csproj -c Release -r win-x64 --self-contained false -p:WindowMode=true -o ./publish/seaw-tmp

      - name: Merge seaw into publish
        if: matrix.rid == 'win-x64'

        run: cp -f publish/seaw-tmp/seaw.* publish/win-x64/ && rm -rf publish/seaw-tmp

      # The install ships its own seashell[.exe] ({DataDir}/current/bin), so
      # `seashell update` works without a global tool. Published per RID with
      # an apphost and WITHOUT embedded archives (no -p:EmbedArchives): this
      # copy carries no version of its own, and `install` on it means update.
      # The archives are only embedded later, by the package job's pack.
      - name: Publish bootstrapper (seashell)
        run: |
          dotnet publish src/SeaShell.Bootstrapper/SeaShell.Bootstrapper.csproj -c Release -r ${{ matrix.rid }} --self-contained false -o ./publish/boot-tmp
          cp -f publish/boot-tmp/* publish/${{ matrix.rid }}/ && rm -rf publish/boot-tmp
          if [ "${{ matrix.os }}" = "windows" ]; then BOOT=seashell.exe; else BOOT=seashell; fi
          test -f "publish/${{ matrix.rid }}/$BOOT" || { echo "MISSING: publish/${{ matrix.rid }}/$BOOT"; exit 1; }

      - name: Upload binaries
        uses: http://gitea:3000/actions/upload-artifact@v3
        with:
          name: binaries-${{ matrix.rid }}
          path: publish/${{ matrix.rid }}/

  # ── Package ────────────────────────────────────────────────────────
  # Create archives, embed in bootstrapper, pack NuGet, validate.

  package:
    needs: [version, build]
    runs-on: win-x64

    steps:
      - uses: http://gitea:3000/actions/checkout@v4

      - name: Set version

        run: |
          VERSION="${{ needs.version.outputs.version }}"
          sed -i "s|<Version>[^<]*</Version>|<Version>$VERSION</Version>|" Directory.Build.props
          echo "Packaging version $VERSION"

      - name: Download Windows binaries
        uses: http://gitea:3000/actions/download-artifact@v3
        with:
          name: binaries-win-x64
          path: publish/win-x64/

      - name: Download Linux binaries
        uses: http://gitea:3000/actions/download-artifact@v3
        with:
          name: binaries-linux-x64
          path: publish/linux-x64/

      - name: Download Alpine binaries
        uses: http://gitea:3000/actions/download-artifact@v3
        with:
          name: binaries-linux-musl-x64
          path: publish/linux-musl-x64/

      - name: Create archives
        shell: powershell
        run: |
          $version = "${{ needs.version.outputs.version }}"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          New-Item -ItemType Directory -Force -Path src/SeaShell.Bootstrapper/archives | Out-Null

          foreach ($rid in @('win-x64', 'linux-x64', 'linux-musl-x64')) {
            $src = "publish/$rid"
            if (-not (Test-Path $src)) { Write-Host "Skipping $rid"; continue }

            $files = Get-ChildItem $src -File | Where-Object { $_.Extension -notin '.pdb','.xml' }

            $embedZip = "src/SeaShell.Bootstrapper/archives/$rid.zip"
            Compress-Archive -Path $files.FullName -DestinationPath $embedZip -Force
            Write-Host "Embedded: $rid.zip ($($files.Count) files)"

            $releaseZip = "dist/seashell-$version-$rid.zip"
            Copy-Item $embedZip $releaseZip
            Write-Host "Release:  seashell-$version-$rid.zip"
          }

      # Build order: bootstrapper published without archives (build job) ->
      # archives (above, each containing that seashell[.exe]) -> pack the tool
      # WITH the archives embedded. Embedding is explicit; it no longer
      # depends on whether an archives/ directory happens to exist.
      - name: Pack
        run: dotnet pack -c Release -o ./nupkg -p:EmbedArchives=true

      - name: Validate packages
        shell: powershell
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $failed = $false

          function Assert-Contains($nupkg, $expected) {
            $zip = [System.IO.Compression.ZipFile]::OpenRead($nupkg)
            $entries = $zip.Entries | ForEach-Object { $_.FullName }
            $zip.Dispose()
            foreach ($e in $expected) {
              if ($entries -contains $e) { Write-Host "  OK: $e" }
              else { Write-Host "  MISSING: $e" -ForegroundColor Red; $script:failed = $true }
            }
          }

          Write-Host "=== SeaShell (bootstrapper) ==="
          $pkg = (Get-ChildItem nupkg/SeaShell.0.*.nupkg).FullName
          Assert-Contains $pkg @('tools/net10.0/any/seashell.dll')

          # Check embedded archives
          $tmp = New-TemporaryFile
          $zip = [System.IO.Compression.ZipFile]::OpenRead($pkg)
          $dllEntry = $zip.Entries | Where-Object { $_.FullName -like '*/seashell.dll' } | Select-Object -First 1
          [System.IO.Compression.ZipFileExtensions]::ExtractToFile($dllEntry, $tmp.FullName, $true)
          $zip.Dispose()
          $bytes = [System.IO.File]::ReadAllBytes($tmp.FullName)
          Remove-Item $tmp.FullName -Force
          $asm = [System.Reflection.Assembly]::Load($bytes)
          $archiveNames = @($asm.GetManifestResourceNames() | Where-Object { $_ -like '*.zip' })
          Write-Host "  Embedded archives: $($archiveNames.Count)"
          if ($archiveNames.Count -lt 3) { Write-Host "  Expected 3 archives" -ForegroundColor Red; $failed = $true }

          # Each archive ships the installed copy of the bootstrapper.
          Add-Type -AssemblyName System.IO.Compression
          foreach ($rid in @('win-x64', 'linux-x64', 'linux-musl-x64')) {
            $name = $archiveNames | Where-Object { $_ -like "*.$rid.zip" } | Select-Object -First 1
            if (-not $name) { Write-Host "  MISSING archive: $rid" -ForegroundColor Red; $failed = $true; continue }
            $exe = if ($rid -eq 'win-x64') { '.exe' } else { '' }
            $archive = New-Object System.IO.Compression.ZipArchive($asm.GetManifestResourceStream($name))
            $entries = $archive.Entries | ForEach-Object { $_.FullName }
            $archive.Dispose()
            foreach ($e in @("seashell$exe", 'seashell.dll', "sea$exe")) {
              if ($entries -contains $e) { Write-Host "  OK: $rid.zip/$e" }
              else { Write-Host "  MISSING: $rid.zip/$e" -ForegroundColor Red; $failed = $true }
            }
          }

          Write-Host "`n=== SeaShell.Host ==="
          $pkg = (Get-ChildItem nupkg/SeaShell.Host.*.nupkg).FullName
          Assert-Contains $pkg @(
            'lib/net10.0/SeaShell.Host.dll',
            'build/net10.0/SeaShell.Host.targets',
            'buildTransitive/net10.0/SeaShell.Host.targets'
          )

          # Verify no unexpected packages
          foreach ($pattern in @('SeaShell.Service.*', 'SeaShell.Engine.*', 'SeaShell.Cli.*', 'SeaShell.Invoker.*')) {
            $found = Get-ChildItem "nupkg/$pattern.nupkg" -ErrorAction SilentlyContinue
            if ($found) { Write-Host "UNEXPECTED: $($found.Name)" -ForegroundColor Red; $failed = $true }
          }

          $count = (Get-ChildItem nupkg/*.nupkg).Count
          Write-Host "`nTotal packages: $count"
          if ($failed) { Write-Host "VALIDATION FAILED" -ForegroundColor Red; exit 1 }
          Write-Host "All packages validated OK" -ForegroundColor Green

      - name: Publish packages to Gitea registry
        run: |
          for pkg in nupkg/*.nupkg; do
            echo "Publishing $(basename "$pkg")..."
            HTTP_CODE=$(curl -s -w '%{http_code}' -o /tmp/nuget_push_response.txt \
              -X PUT "${{ github.server_url }}/api/packages/${{ github.repository_owner }}/nuget/" \
              -H "Authorization: token ${{ secrets.API_TOKEN }}" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@$pkg")
            if [ "$HTTP_CODE" = "201" ]; then
              echo "  Pushed (201 Created)"
            elif [ "$HTTP_CODE" = "409" ]; then
              echo "  Skipped (409 Conflict — already exists)"
            else
              echo "  Failed (HTTP $HTTP_CODE)"
              cat /tmp/nuget_push_response.txt
              exit 1
            fi
          done

      - name: Upload packages
        uses: http://gitea:3000/actions/upload-artifact@v3
        with:
          name: packages
          path: nupkg/

      - name: Upload dist archives
        uses: http://gitea:3000/actions/upload-artifact@v3
        with:
          name: dist
          path: dist/

  # ── Test ───────────────────────────────────────────────────────────
  # Install from packages, run full test suite on all platforms.

  test:
    needs: [version, package]
    # Dedicated test VMs only (seashell-test-* labels). This job installs and
    # uninstalls SeaShell machine-wide (the runner account plus SYSTEM / root)
    # and on Windows needs an interactive logon of the runner account, so it
    # must not land on a general runner such as a workstation with its own
    # SeaShell install. build / package only need the SDK and run anywhere.
    # Alpine has a single runner, dedicated already.
    strategy:
      matrix:
        include:
          - runner: seashell-test-win-x64
            rid: win-x64
            os: windows
          - runner: seashell-test-linux-x64
            rid: linux-x64
            os: linux
          - runner: linux-musl-x64
            rid: linux-musl-x64
            os: linux
    runs-on: ${{ matrix.runner }}

    # Cleanup helpers, used by the steps that end SeaShell processes. They
    # touch only what this job owns — never another user's processes, nor the
    # runner account's own scripts that have nothing to do with this job
    # (e.g. an operational script run from the SeaShell cache). Ended are:
    # - the runner account's daemon and elevator (so the install can be
    #   replaced),
    # - the runner account's scripts and launchers (sea, seaw, seashell, a
    #   script hosted by dotnet or run as an exe from the data dir) whose
    #   command line or working directory is in this job's checkout
    #   (GITHUB_WORKSPACE), RUNNER_TEMP or a seashell-* dir under temp (the
    #   tests', the update / uninstall copies),
    # - the processes of the SYSTEM / root install the job replaces (owner
    #   SYSTEM / root and run from that install's data dir).
    # Each process and task is printed with its owner, ended or left alone.
    #
    # Windows: & ([scriptblock]::Create($env:SEASHELL_CI_CLEANUP_PS1)) [-Apply] [-Tasks] [-UserOnly] [-Names a.exe,b.exe]
    #   Without -Apply it only lists. -Tasks: also the \SeaShell\ tasks of the
    #   runner account and SYSTEM (daemon, elevator, update) and the test's
    #   own scheduled script; other tasks in the folder are left alone.
    #   -Names / -UserOnly: only those executables, only the runner account's.
    # Linux: printf '%s\n' "$SEASHELL_CI_CLEANUP_SH" | sudo bash -s -- list|apply "$(id -u)" "$(id -un)" "$DATA" "$GITHUB_WORKSPACE" "${TMPDIR:-/tmp}" "${RUNNER_TEMP:-}"
    #   As root (root's /proc entries); apply also removes the runner
    #   account's and root's daemon sockets.
    env:
      SEASHELL_CI_CLEANUP_PS1: |
        param([switch]$Apply, [switch]$Tasks, [switch]$UserOnly, [string[]]$Names)
        $me = [Security.Principal.WindowsIdentity]::GetCurrent().User.Value
        $userRoot = Join-Path $env:LOCALAPPDATA 'seashell'
        $systemRoots = @((Join-Path $env:SystemRoot 'System32\config\systemprofile\AppData\Local\seashell'), (Join-Path $env:ProgramData 'seashell'))
        $services = @('seashell-daemon.exe', 'seashell-elevator.exe')
        $launchers = @('sea.exe', 'seaw.exe', 'seashell.exe')
        $verb = if ($Apply) { 'ended' } else { 'would end' }
        # This job's places; an unset GITHUB_WORKSPACE / RUNNER_TEMP adds none.
        $jobRoots = @(@($env:GITHUB_WORKSPACE, $env:RUNNER_TEMP) | Where-Object { $_ } | ForEach-Object { [IO.Path]::GetFullPath($_).TrimEnd('\') + '\' })
        $jobRoots += Join-Path ([IO.Path]::GetTempPath()) 'seashell-'
        function Test-Job($s) {
          if (-not $s) { return $false }
          $s = $s.Replace('/', '\')
          foreach ($r in $jobRoots) { if ($s.IndexOf($r, [StringComparison]::OrdinalIgnoreCase) -ge 0) { return $true } }
          return $false
        }
        # The working directory of another process (scripts are mostly started
        # by a relative path): read from its PEB, x64. Null when not readable.
        $haveCwd = $true
        try {
          if (-not ('SeaShellCi.Cwd' -as [type])) {
            Add-Type -ErrorAction Stop -TypeDefinition @'
        using System;
        using System.Runtime.InteropServices;
        namespace SeaShellCi {
          public static class Cwd {
            [DllImport("kernel32.dll")] static extern IntPtr OpenProcess(int access, bool inherit, int pid);
            [DllImport("kernel32.dll")] static extern bool CloseHandle(IntPtr h);
            [DllImport("kernel32.dll")] static extern bool ReadProcessMemory(IntPtr h, IntPtr at, byte[] buf, IntPtr size, out IntPtr read);
            [DllImport("ntdll.dll")] static extern int NtQueryInformationProcess(IntPtr h, int infoClass, IntPtr[] info, int size, out int written);
            static byte[] Read(IntPtr h, IntPtr at, int size) {
              var buf = new byte[size]; IntPtr read;
              return ReadProcessMemory(h, at, buf, (IntPtr)size, out read) && read.ToInt64() == size ? buf : null;
            }
            // PEB.ProcessParameters at 0x20, its CurrentDirectory.DosPath at 0x38 (x64).
            public static string Get(int pid) {
              if (IntPtr.Size != 8) return null;
              var h = OpenProcess(0x0410, false, pid); // PROCESS_QUERY_INFORMATION | PROCESS_VM_READ
              if (h == IntPtr.Zero) return null;
              try {
                var pbi = new IntPtr[6]; int written;
                if (NtQueryInformationProcess(h, 0, pbi, IntPtr.Size * 6, out written) != 0) return null;
                var p = Read(h, IntPtr.Add(pbi[1], 0x20), 8); if (p == null) return null;
                var u = Read(h, IntPtr.Add(new IntPtr(BitConverter.ToInt64(p, 0)), 0x38), 16); if (u == null) return null;
                int len = BitConverter.ToUInt16(u, 0);
                if (len == 0) return null;
                var s = Read(h, new IntPtr(BitConverter.ToInt64(u, 8)), len);
                return s == null ? null : System.Text.Encoding.Unicode.GetString(s);
              } finally { CloseHandle(h); }
            }
          }
        }
        '@
          }
        } catch { $haveCwd = $false; Write-Host "  (working directories not readable: $($_.Exception.Message))" }
        # Run from under a data dir: the executable, or dotnet with a dll there.
        function Test-Under($p, $roots) {
          foreach ($r in $roots) {
            $r = $r.TrimEnd('\') + '\'
            if ($p.ExecutablePath -and $p.ExecutablePath.StartsWith($r, [StringComparison]::OrdinalIgnoreCase)) { return $true }
            if ($p.Name -eq 'dotnet.exe' -and $p.CommandLine -and $p.CommandLine.IndexOf($r, [StringComparison]::OrdinalIgnoreCase) -ge 0) { return $true }
          }
          return $false
        }
        foreach ($p in @(Get-CimInstance Win32_Process)) {
          if ($p.ProcessId -eq $PID) { continue }
          if ($Names -and $Names -notcontains $p.Name) { continue }
          # Daemon / elevator: by name, or dotnet hosting their dll.
          $service = ($services -contains $p.Name) -or ($p.Name -eq 'dotnet.exe' -and $p.CommandLine -match 'seashell-(daemon|elevator)\.dll')
          # A script: a launcher, or hosted / run as an exe from the data dir.
          $script = -not $service -and (($launchers -contains $p.Name) -or (-not $Names -and (Test-Under $p @($userRoot))))
          $system = -not $Names -and -not $UserOnly -and (Test-Under $p $systemRoots)
          if (-not ($service -or $script -or $system)) { continue }
          $sid = (Invoke-CimMethod -InputObject $p -MethodName GetOwnerSid -ErrorAction SilentlyContinue).Sid
          $o = Invoke-CimMethod -InputObject $p -MethodName GetOwner -ErrorAction SilentlyContinue
          $owner = if ($o -and $o.User) { "$($o.Domain)\$($o.User)" } elseif ($sid) { $sid } else { '?' }
          $cwd = $null; $job = $false
          if ($script -and $sid -eq $me) {
            if ($haveCwd) { try { $cwd = [SeaShellCi.Cwd]::Get([int]$p.ProcessId) } catch { } }
            $job = (Test-Job $p.CommandLine) -or (Test-Job $cwd)
          }
          $scope = $null
          if ($sid -eq $me -and $service) { $scope = 'runner account' }
          elseif ($sid -eq $me -and $job) { $scope = "runner account, this job's" }
          elseif ($sid -eq 'S-1-5-18' -and $system) { $scope = 'SYSTEM install' }
          $what = "$($p.Name) pid $($p.ProcessId) owner $owner, $(if ($p.ExecutablePath) { $p.ExecutablePath } else { '(path not visible)' })"
          if ($script) { $what += "; command line: $($p.CommandLine)$(if ($cwd) { "; cwd: $cwd" })" }
          if (-not $scope) { Write-Host "  left alone: $what"; continue }
          if ($Apply) {
            Stop-Process -Id $p.ProcessId -Force -ErrorAction SilentlyContinue
            if (-not $?) { Write-Host "  could not end ($scope): $what"; continue }
          }
          Write-Host "  $verb ($scope): $what"
        }
        if ($Tasks) {
          $u = [regex]::Escape($env:USERNAME)
          $pattern = "^(SeaShell (Daemon|Elevator|Update) \(($u|SYSTEM)\)|$u - schedule_marker_test$)"
          foreach ($t in @(Get-ScheduledTask -TaskPath '\SeaShell\' -ErrorAction SilentlyContinue)) {
            $what = "\SeaShell\$($t.TaskName) (runs as $($t.Principal.UserId))"
            if ($t.TaskName -notmatch $pattern) { Write-Host "  left alone: task $what"; continue }
            if (-not $Apply) { Write-Host "  would unregister: task $what"; continue }
            Unregister-ScheduledTask -TaskPath '\SeaShell\' -TaskName $t.TaskName -Confirm:$false -ErrorAction SilentlyContinue
            if ($?) { Write-Host "  unregistered: task $what" } else { Write-Host "  could not unregister: task $what" }
          }
        }
      SEASHELL_CI_CLEANUP_SH: |
        MODE=$1 JOB_UID=$2 JOB_USER=$3 DATA=${4%/} WS=${5%/} TMP=${6:-/tmp} RTMP=${7%/}
        TMP=${TMP%/}
        ROOT_DATA=/var/lib/seashell
        NAMES=' sea seashell seashell-daemon seashell-elevator '
        if [ "$MODE" = apply ]; then VERB=killed; else VERB="would kill"; fi
        # In this job's places (see above); an empty workspace matches nothing.
        in_job() {
          if [ -n "$WS" ]; then case "$1" in *"$WS"/*|*"$WS") return 0 ;; esac; fi
          if [ -n "$RTMP" ]; then case "$1" in *"$RTMP"/*|*"$RTMP") return 0 ;; esac; fi
          case "$1" in *"$TMP"/seashell-*) return 0 ;; esac
          return 1
        }
        for d in /proc/[0-9]*; do
          pid=${d#/proc/}
          [ "$pid" = "$$" ] && continue
          args=$(tr '\0' ' ' < "$d/cmdline" 2>/dev/null) || continue
          [ -n "$args" ] || continue
          uid=$(stat -c %u "$d" 2>/dev/null) || continue
          exe=$(readlink "$d/exe" 2>/dev/null || true)
          base=${exe##*/}; base=${base% (deleted)}
          named=; case "$NAMES" in *" $base "*) named=1 ;; esac
          scope= script= cwd=
          if [ "$uid" = "$JOB_UID" ]; then
            # Daemon / elevator: by name, or dotnet hosting their dll.
            case "$base" in
              seashell-daemon|seashell-elevator) scope="runner account" ;;
              dotnet) case "$args" in *seashell-daemon.dll*|*seashell-elevator.dll*) scope="runner account" ;; esac ;;
            esac
            if [ -z "$scope" ]; then
              # A script: a launcher, or hosted / run as an exe from the data dir;
              # ended only when it is this job's (command line or working dir).
              case "$base" in sea|seashell) script=1 ;; esac
              case "$exe $args" in "$DATA"/*|*" $DATA/"*) script=1 ;; esac
              if [ -n "$script" ]; then
                cwd=$(readlink "$d/cwd" 2>/dev/null || true)
                if in_job "$args" || in_job "$cwd"; then scope="runner account, this job's"; fi
              fi
            fi
          elif [ "$uid" = 0 ]; then
            case "$exe $args" in "$ROOT_DATA"/*|*" $ROOT_DATA/"*) scope="root install" ;; esac
          fi
          what="$base pid $pid owner $(stat -c %U "$d" 2>/dev/null || echo "$uid"), $exe: $args"
          [ -z "$cwd" ] || what="$what (cwd $cwd)"
          if [ -z "$scope" ]; then
            [ -n "$named" ] || [ -n "$script" ] || case "$exe $args" in */seashell/*) ;; *) continue ;; esac
            echo "  left alone: $what"; continue
          fi
          if [ "$MODE" = apply ] && ! kill -9 "$pid" 2>/dev/null; then echo "  could not kill ($scope): $what"; continue; fi
          echo "  $VERB ($scope): $what"
        done
        # Daemon and elevator sockets of the runner account and root (named by
        # uid since 0.6.0, by user name before), in /tmp and the runtime dir.
        if [ "$MODE" = apply ]; then
          for s in /tmp/seashell-*-"$JOB_UID".sock /tmp/seashell-*-"$JOB_USER".sock /tmp/seashell-*-0.sock \
                   /tmp/seashell-*-root.sock /run/user/"$JOB_UID"/seashell-*.sock; do
            if [ -e "$s" ]; then rm -f "$s" && echo "  removed $s"; fi
          done
        fi
        exit 0

    steps:
      - uses: http://gitea:3000/actions/checkout@v4

      - name: Download packages
        uses: http://gitea:3000/actions/download-artifact@v3
        with:
          name: packages
          path: nupkg/

      # ── Phase 1: Install ────────────────────────────────────────────
      # Start from nothing (no daemons, tasks or data dirs), then the
      # migration test (the previous release installed the old way, then this
      # build's bootstrapper over it), then this build's normal install with
      # --all, which the functional tests run on.
      #
      # Only the installed bin dir goes on the job PATH ($GITHUB_PATH), not
      # ~/.dotnet/tools: `seashell` must resolve to the installed copy, and
      # the steps that need the global tool call it by its full path.

      - name: "Install: Kill SeaShell processes (Windows)"
        if: matrix.os == 'windows'
        shell: powershell
        run: |
          # The runner account's and the SYSTEM install's processes and tasks
          # only (see SEASHELL_CI_CLEANUP_PS1 above).
          $ErrorActionPreference = 'Continue'
          & ([scriptblock]::Create($env:SEASHELL_CI_CLEANUP_PS1)) -Apply -Tasks
          Start-Sleep -Seconds 2
          exit 0

      - name: "Install: Kill SeaShell processes (Linux)"
        if: matrix.os == 'linux'

        run: |
          # The runner account's and the root install's processes and sockets
          # only (see SEASHELL_CI_CLEANUP_SH above).
          printf '%s\n' "$SEASHELL_CI_CLEANUP_SH" | sudo bash -s -- apply "$(id -u)" "$(id -un)" "${XDG_DATA_HOME:-$HOME/.local/share}/seashell" \
            "$GITHUB_WORKSPACE" "${TMPDIR:-/tmp}" "${RUNNER_TEMP:-}"
          sleep 2

      - name: "Install: Clear caches (Windows)"
        if: matrix.os == 'windows'
        shell: powershell
        run: |
          # Wipe the SeaShell data dirs of the runner account and of SYSTEM
          # (version dirs, current junctions, install.scope) left by earlier
          # runs, and the pre-0.5.0 ProgramData dir. The installs recreate them.
          Remove-Item "$env:LOCALAPPDATA\seashell" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item "$env:SystemRoot\System32\config\systemprofile\AppData\Local\seashell" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item "C:\ProgramData\seashell" -Recurse -Force -ErrorAction SilentlyContinue

      - name: "Install: Clear caches (Linux)"
        if: matrix.os == 'linux'

        run: |
          # Wipe the user's and root's SeaShell data dirs — installers recreate.
          rm -rf "${XDG_DATA_HOME:-$HOME/.local/share}/seashell"
          sudo rm -rf /var/lib/seashell
          # The ~/.local/bin symlinks of both installs.
          rm -f "$HOME/.local/bin/sea" "$HOME/.local/bin/seashell"
          sudo rm -f /root/.local/bin/sea /root/.local/bin/seashell
          # An automatic-update line left by a failed earlier run (it would
          # point at that run's workspace). Rewrite a crontab only when it has one.
          TAG='# seashell-auto-update'
          if crontab -l > /tmp/ci-crontab 2>/dev/null && grep -qF "$TAG" /tmp/ci-crontab; then
            { grep -vF "$TAG" /tmp/ci-crontab || true; } | crontab -
          fi
          if sudo crontab -l > /tmp/ci-crontab 2>/dev/null && grep -qF "$TAG" /tmp/ci-crontab; then
            { grep -vF "$TAG" /tmp/ci-crontab || true; } | sudo crontab -
          fi
          rm -f /tmp/ci-crontab

      # Migration test, part 1: the latest release from nuget.org, installed
      # the way 0.6.2 and earlier were (global tool, then `seashell install`;
      # --all on Windows). Skipped with a notice when nuget.org cannot be reached.
      - name: "Install: Migration 1/2 - previous release, installed the old way"

        run: |
          VERSION="${{ needs.version.outputs.version }}"
          if [ "${{ matrix.os }}" = "windows" ]; then
            TOOLS="$(cygpath -u "$USERPROFILE")/.dotnet/tools"
          else
            TOOLS="$HOME/.dotnet/tools"
          fi
          dotnet tool uninstall -g SeaShell >/dev/null 2>&1 || true

          # Highest stable version; the flat-container index lists versions in
          # ascending order, and a prerelease ("-" suffix) does not match.
          INDEX=$(curl -fsS --max-time 30 https://api.nuget.org/v3-flatcontainer/seashell/index.json) || INDEX=""
          RELEASED=$(printf '%s' "$INDEX" | tr -d ' \r\n' | grep -oE '"[0-9]+(\.[0-9]+)+"' | tr -d '"' | tail -n 1 || true)
          if [ -z "$RELEASED" ] || [ "$RELEASED" = "$VERSION" ]; then
            echo "::notice::Migration test skipped: no previous SeaShell release found on nuget.org from this runner (got '${RELEASED}')"
            echo "MIGRATE_FROM=" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "Previous release: SeaShell $RELEASED (this build: $VERSION)"

          export PATH="$TOOLS:$PATH"
          dotnet tool install -g SeaShell --version "$RELEASED" --source https://api.nuget.org/v3/index.json
          if [ "${{ matrix.os }}" = "windows" ]; then
            "$TOOLS/seashell" install --all
          else
            "$TOOLS/seashell" install
          fi
          echo "MIGRATE_FROM=$RELEASED" >> "$GITHUB_ENV"

      # The kind of the user PATH registry value before this build's
      # bootstrapper first edits it (after the previous release's install,
      # whose own PATH handling is not under test). The uninstall test asserts
      # that it is unchanged.
      - name: "Install: Record user PATH value kind (Windows)"
        if: matrix.os == 'windows'
        shell: powershell
        run: |
          $key = [Microsoft.Win32.Registry]::CurrentUser.OpenSubKey('Environment')
          $name = if ($key) { $key.GetValueNames() | Where-Object { $_ -eq 'Path' } | Select-Object -First 1 }
          $kind = if ($name) { $key.GetValueKind($name).ToString() } else { 'None' }
          Write-Host "HKCU\Environment\Path kind: $kind"
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, "USER_PATH_KIND=$kind`n")

      # Migration test, part 2: this build's bootstrapper (it carries the
      # archives) run without installing it as a tool, with no scope flags.
      # It must take the old install's scope as it finds it and record it.
      - name: "Install: Migration 2/2 - this build's bootstrapper, no scope flags"

        run: |
          if [ -z "$MIGRATE_FROM" ]; then echo "Migration test skipped (see the previous step)"; exit 0; fi
          VERSION="${{ needs.version.outputs.version }}"
          if [ "${{ matrix.os }}" = "windows" ]; then
            DATA="$(cygpath -u "$LOCALAPPDATA")/seashell"
            FEED="$(cygpath -m "$(pwd)/nupkg")"
            EXPECTED_SCOPE="user elevator system"
          else
            DATA="${XDG_DATA_HOME:-$HOME/.local/share}/seashell"
            FEED="$(pwd)/nupkg"
            EXPECTED_SCOPE="user"
          fi

          echo "Migrating from $MIGRATE_FROM to $VERSION"
          # --yes (before the package id, so it is dotnet's option, not passed
          # to SeaShell): consent to the tool package download, which the SDK
          # otherwise asks for when stdin is not a terminal. stdin from
          # /dev/null: a SeaShell confirmation prompt fails instead of waiting.
          dotnet tool exec --yes --source "$FEED" "SeaShell@$VERSION" install < /dev/null

          OUT=$("$DATA/current/bin/sea" --version | tr -d '\r')
          echo "$OUT"
          [ "$OUT" = "{~} SeaShell v$VERSION" ] || { echo "FAIL: expected {~} SeaShell v$VERSION after the migration"; exit 1; }
          [ -f "$DATA/install.scope" ] || { echo "FAIL: no $DATA/install.scope recorded"; exit 1; }
          SCOPE=$(tr -s '\r\n' '  ' < "$DATA/install.scope" | sed 's/^ *//; s/ *$//')
          echo "install.scope: $SCOPE"
          [ "$SCOPE" = "$EXPECTED_SCOPE" ] || { echo "FAIL: expected the old install's scope '$EXPECTED_SCOPE'"; exit 1; }
          dotnet tool list -g

      # This build's install, everything: Windows user + elevator + SYSTEM
      # (the runner is elevated, UAC off), Linux user + root (through sudo,
      # passwordless on the runners). A failure fails the job.
      - name: "Install: dotnet tool + seashell install --all"

        run: |
          VERSION="${{ needs.version.outputs.version }}"
          if [ "${{ matrix.os }}" = "windows" ]; then
            TOOL="$(cygpath -u "$USERPROFILE")/.dotnet/tools/seashell.exe"
            FEED="$(cygpath -m "$(pwd)/nupkg")"
            SEA_BIN="$LOCALAPPDATA/seashell/current/bin"
          else
            TOOL="$HOME/.dotnet/tools/seashell"
            FEED="$(pwd)/nupkg"
            SEA_BIN="${XDG_DATA_HOME:-$HOME/.local/share}/seashell/current/bin"
          fi
          dotnet tool uninstall -g SeaShell 2>/dev/null || true
          dotnet tool install -g SeaShell --version "$VERSION" --source "$FEED"
          # The global tool carries the archives; the installed copy does not.
          "$TOOL" install --all
          # The `current` junction/symlink keeps this stable across versions.
          echo "$SEA_BIN" >> "$GITHUB_PATH"

      - name: "Install: Verify (Windows)"
        if: matrix.os == 'windows'
        shell: powershell
        run: |
          $version = '${{ needs.version.outputs.version }}'
          $data = Join-Path $env:LOCALAPPDATA 'seashell'
          $bin = Join-Path $data 'current\bin'
          $failed = $false
          function Fail($m) { Write-Host "FAIL: $m"; $script:failed = $true }

          $principal = [Security.Principal.WindowsPrincipal][Security.Principal.WindowsIdentity]::GetCurrent()
          Write-Host "Runner account: $env:USERNAME, elevated: $($principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator))"

          $out = (& sea --version | Out-String).Trim()
          Write-Host $out
          if ($out -ne "{~} SeaShell v$version") { Fail "sea --version: expected {~} SeaShell v$version" }

          foreach ($name in 'seashell', 'sea') {
            $cmd = Get-Command $name -CommandType Application -ErrorAction SilentlyContinue | Select-Object -First 1
            $expected = [IO.Path]::GetFullPath((Join-Path $bin "$name.exe"))
            $actual = if ($cmd) { [IO.Path]::GetFullPath($cmd.Source) } else { '<not found>' }
            if ($actual -ne $expected) { Fail "$name resolves to $actual, expected $expected"; Write-Host "PATH=$env:PATH" }
            else { Write-Host "OK: $name -> $actual" }
          }

          $scopeFile = Join-Path $data 'install.scope'
          $scope = if (Test-Path $scopeFile) { @(Get-Content $scopeFile | Where-Object { $_.Trim() }) -join ' ' } else { '<missing>' }
          Write-Host "install.scope: $scope"
          if ($scope -ne 'user elevator system') { Fail "install.scope: expected 'user elevator system'" }

          $sysCurrent = Join-Path $env:SystemRoot 'System32\config\systemprofile\AppData\Local\seashell\current'
          if (Test-Path $sysCurrent) { Write-Host "OK: SYSTEM install ($sysCurrent)" } else { Fail "no SYSTEM install ($sysCurrent)" }

          $tasks = @(Get-ScheduledTask -TaskPath '\SeaShell\' -ErrorAction SilentlyContinue | ForEach-Object { $_.TaskName })
          foreach ($t in "SeaShell Daemon ($env:USERNAME) $version", "SeaShell Elevator ($env:USERNAME) $version", "SeaShell Daemon (SYSTEM) $version") {
            if ($tasks -contains $t) { Write-Host "OK: task \SeaShell\$t" } else { Fail "task \SeaShell\$t not registered (found: $($tasks -join ', '))" }
          }

          $status = (& sea --status | Out-String)
          Write-Host $status
          if ($status -notmatch ', up ') { Fail 'daemon not running after the install' }
          if ($failed) { exit 1 }

      - name: "Install: Verify (Linux)"
        if: matrix.os == 'linux'

        run: |
          VERSION="${{ needs.version.outputs.version }}"
          DATA="${XDG_DATA_HOME:-$HOME/.local/share}/seashell"
          SEA_BIN="$DATA/current/bin"
          fail() { echo "FAIL: $*"; exit 1; }

          OUT=$(sea --version)
          echo "$OUT"
          [ "$OUT" = "{~} SeaShell v$VERSION" ] || fail "sea --version: expected {~} SeaShell v$VERSION"

          for name in seashell sea; do
            RESOLVED=$(command -v "$name" || true)
            [ "$RESOLVED" = "$SEA_BIN/$name" ] || { echo "PATH=$PATH"; fail "$name resolves to '$RESOLVED', expected $SEA_BIN/$name"; }
            echo "OK: $name -> $RESOLVED"
          done

          [ -f "$DATA/install.scope" ] || fail "no $DATA/install.scope"
          SCOPE=$(tr -s '\n' ' ' < "$DATA/install.scope" | sed 's/^ *//; s/ *$//')
          echo "install.scope: $SCOPE"
          [ "$SCOPE" = "user system" ] || fail "install.scope: expected 'user system'"

          sudo test -e /var/lib/seashell/current || fail "root has no install (/var/lib/seashell/current)"
          ROOT_CURRENT=$(sudo readlink /var/lib/seashell/current || true)
          echo "root: /var/lib/seashell/current -> $ROOT_CURRENT"
          case "$ROOT_CURRENT" in *"v$VERSION") ;; *) fail "root's install is not v$VERSION" ;; esac

          sea --start || fail "sea --start exited $?"
          STATUS=""
          for i in $(seq 1 15); do
            STATUS=$(sea --status 2>&1) || true
            grep -q ", up " <<< "$STATUS" && break
            sleep 1
          done
          echo "$STATUS"
          grep -q ", up " <<< "$STATUS" || fail "daemon not running after sea --start"

      # ── Phase 2: Functional tests ──────────────────────────────────

      - name: "Test: dotnet test EngineTest"
        # No --no-build: this job starts from a fresh checkout. --no-build also
        # skips restore, so without the test SDK's targets the project isn't
        # recognised as a test project and the step "passes" running nothing.
        # dotnet test can exit 0 without running anything, so require a results file.
        run: |
          RESULTS="$(pwd)/artifacts/enginetest"
          rm -rf "$RESULTS"
          TEST_STATUS=0
          dotnet test test/EngineTest/EngineTest.csproj -c Release \
            --results-directory "$RESULTS" --logger "trx;LogFileName=enginetest.trx" || TEST_STATUS=$?
          if [ ! -f "$RESULTS/enginetest.trx" ]; then
            echo "EngineTest produced no results file - diagnostics:"
            dotnet --info | head -30
            env | grep -iE '^(DOTNET|VSTEST|MSBUILD|NUGET|TERM)' || true
            dotnet test test/EngineTest/EngineTest.csproj -c Release -v detailed 2>&1 \
              | grep -iE 'VSTest|IsTestProject|TestSdk|testhost|skipp|Microsoft\.NET\.Test' | head -80
            exit 1
          fi
          grep -o '<Counters [^>]*>' "$RESULTS/enginetest.trx"
          if [ "$TEST_STATUS" -ne 0 ]; then
            # The musl runner's log does not show VSTest's console output; name the failures.
            echo "Failed tests:"
            grep -o 'testName="[^"]*"[^>]*outcome="Failed"' "$RESULTS/enginetest.trx" | sed 's/^testName="//; s/".*//'
            exit "$TEST_STATUS"
          fi

      - name: "Test: engine-dir-nuget (dotnet run, NuGet cache layout)"

        run: |
          export SEASHELL_NUPKG_DIR="$(pwd)/nupkg"
          dotnet run --project test/engine-dir-nuget

      - name: "Test: hello.cs"
        run: sea test/hello.cs

      - name: "Test: sea_context_test.cs"
        run: sea test/sea_context_test.cs

      - name: "Test: interactive_ok.cs"
        run: sea test/interactive_ok.cs

      - name: "Test: nuget-transitive (CS1704 dedup)"
        run: sea test/nuget-transitive/nuget-transitive.cs

      - name: "Test: nuget-native-sqlite (native runtime assets, per RID)"
        run: sea test/nuget-native-sqlite/nuget-native-sqlite.cs

      - name: "Test: nuget-runtime-sqlclient (RID-specific managed assets)"
        run: sea test/nuget-runtime-sqlclient/nuget-runtime-sqlclient.cs

      - name: "Test: nuget-native-dacfx (native runtime assets, Windows)"
        if: matrix.os == 'windows'
        shell: powershell
        run: |
          # End-to-end native asset staging — needs the runner's local SQL Server.
          $svc = Get-Service -Name 'MSSQL*' -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -match '^MSSQL(\$.+|SERVER)$' -and $_.Status -eq 'Running' } |
            Select-Object -First 1
          if (-not $svc) { Write-Host 'No running SQL Server service on runner'; exit 1 }
          $ds = if ($svc.Name -eq 'MSSQLSERVER') { 'localhost' } else { 'localhost\' + $svc.Name.Split('$')[1] }
          Write-Host "Using SQL Server instance: $ds"
          sea test/nuget-native-dacfx/nuget-native-dacfx.cs "$ds"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: "Test: host-in-host (ScriptHost compilation)"
        run: sea test/host-in-host/host-in-host.cs

      - name: "Test: host-resolution (bundled DLL probing)"
        run: sea test/host-resolution/host-resolution.cs

      - name: "Test: host-in-host-nuget (nested ScriptHost + NuGet)"
        run: sea test/host-in-host-nuget/host-in-host-nuget.cs

      - name: "Test: host-child-process (a script's leftover child does not hold ScriptHost runs open)"
        run: sea test/host-child-process/host-child-process.cs

      - name: "Test: binary-deps (companion deps.json pass-through)"

        run: |
          export SEASHELL_NUPKG_DIR="$(pwd)/nupkg"
          dotnet publish test/binary-deps -c Release -o ./artifacts/binary-deps-test --force
          sea ./artifacts/binary-deps-test/binary-deps.dll

      # ── Service tests ──────────────────────────────────────────────

      - name: "Test: service-cwd (Windows)"
        if: matrix.os == 'windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $PUBLISH_DIR = "./artifacts/service-cwd-test"
          $MARKER_DIR = "$PUBLISH_DIR/markers"
          $MARKER_FILE = "$MARKER_DIR/seashell-cwd-test.marker"
          $SERVICE_NAME = "seashell-cwd-test"
          $EXE = "$PUBLISH_DIR/ServiceCwdTest.exe"

          New-Item -ItemType Directory -Force -Path $MARKER_DIR | Out-Null
          Remove-Item $MARKER_FILE -Force -ErrorAction SilentlyContinue

          dotnet nuget locals http-cache --clear
          $env:SEASHELL_NUPKG_DIR = "$(Get-Location)/nupkg"
          dotnet publish test/ServiceCwdTest -c Release -r ${{ matrix.rid }} --self-contained false -o $PUBLISH_DIR --force

          # Clean up leftover service from previous runs
          sc.exe stop $SERVICE_NAME 2>$null; Start-Sleep -Seconds 3
          sc.exe delete $SERVICE_NAME 2>$null

          & $EXE install
          & $EXE start

          # Wait for marker (30s)
          $found = $false
          for ($i = 0; $i -lt 30; $i++) {
            if (Test-Path $MARKER_FILE) { $found = $true; break }
            Start-Sleep -Seconds 1
          }

          if (-not $found) {
            Write-Host "Marker file not found after 30s"
            Get-WinEvent -FilterHashtable @{LogName='Application';ProviderName='.NET Runtime';StartTime=(Get-Date).AddMinutes(-2)} -MaxEvents 5 -ErrorAction SilentlyContinue | Format-List
            & $EXE stop 2>$null
            & $EXE uninstall 2>$null
            exit 1
          }

          $content = Get-Content $MARKER_FILE -Raw
          Write-Host $content
          if ($content -notmatch 'Script=') { Write-Host "Missing Script= in marker"; exit 1 }
          if ($content -notmatch 'NuGet=') { Write-Host "Missing NuGet= in marker"; exit 1 }
          if ($content -match 'NuGet=FAIL') { Write-Host "NuGet=FAIL in marker"; exit 1 }

          # Wait for the service to be stopped before deleting it, and for the
          # deletion to complete: a service deleted while stopping stays
          # "marked for deletion" (1072) and the next step cannot recreate it.
          & $EXE stop 2>$null
          foreach ($i in 1..30) {
            $svc = Get-Service -Name seashell-cwd-test -ErrorAction SilentlyContinue
            if (-not $svc -or $svc.Status -eq 'Stopped') { break }
            Start-Sleep -Seconds 1
          }
          & $EXE uninstall 2>$null
          foreach ($i in 1..30) {
            if (-not (Get-Service -Name seashell-cwd-test -ErrorAction SilentlyContinue)) { break }
            Start-Sleep -Seconds 1
          }

      - name: "Test: service-cwd (Linux)"
        if: matrix.os == 'linux'

        run: |
          PUBLISH_DIR="./artifacts/service-cwd-test"
          MARKER_DIR="$PUBLISH_DIR/markers"
          MARKER_FILE="$MARKER_DIR/seashell-cwd-test.marker"
          SERVICE_NAME="seashell-cwd-test"
          EXE="$PUBLISH_DIR/ServiceCwdTest"

          mkdir -p "$MARKER_DIR"
          rm -f "$MARKER_FILE"

          dotnet nuget locals http-cache --clear
          export SEASHELL_NUPKG_DIR="$(pwd)/nupkg"
          dotnet publish test/ServiceCwdTest -c Release -r ${{ matrix.rid }} --self-contained false -o "$PUBLISH_DIR" --force
          chmod +x "$EXE"

          # ── Diagnostics: environment ──
          echo "=== Init system detection ==="
          echo "  /run/systemd/system: $([ -d /run/systemd/system ] && echo YES || echo NO)"
          echo "  /sbin/openrc:        $([ -f /sbin/openrc ] && echo YES || echo NO)"
          echo "  /sbin/rc-status:     $([ -f /sbin/rc-status ] && echo YES || echo NO)"
          echo "  /etc/alpine-release: $(cat /etc/alpine-release 2>/dev/null || echo 'N/A')"
          echo "  RID: ${{ matrix.rid }}"
          echo ""
          echo "=== Published binary ==="
          file "$EXE" 2>/dev/null || echo "  (file command not available)"
          ls -la "$PUBLISH_DIR/" | head -20 || true
          echo ""

          # Clean up leftover service from previous runs
          sudo "$EXE" stop 2>/dev/null || true
          sleep 2
          sudo "$EXE" uninstall 2>/dev/null || true

          # ── Install with full output ──
          echo "=== Install ==="
          sudo "$EXE" install 2>&1 | tee /tmp/svc-install.log
          INSTALL_RC=${PIPESTATUS[0]}
          echo "  install exit code: $INSTALL_RC"

          # ── Diagnostics: generated service file ──
          echo ""
          echo "=== Generated service file ==="
          if [ -f "/etc/systemd/system/$SERVICE_NAME.service" ]; then
            echo "  [systemd unit]"
            cat "/etc/systemd/system/$SERVICE_NAME.service"
          elif [ -f "/etc/init.d/$SERVICE_NAME" ]; then
            echo "  [OpenRC init script]"
            cat "/etc/init.d/$SERVICE_NAME"
            echo ""
            echo "  permissions: $(ls -la /etc/init.d/$SERVICE_NAME)"
            echo "  rc-update list:"
            rc-update show 2>/dev/null | grep "$SERVICE_NAME" || echo "  (not in any runlevel)"
          else
            echo "  WARNING: no service file found in /etc/systemd/system/ or /etc/init.d/"
            ls -la /etc/init.d/ 2>/dev/null | tail -10 || true
          fi
          echo ""

          # ── Diagnostics: pre-start state ──
          echo "=== Pre-start checks ==="
          echo "  exe path resolves to: $(readlink -f "$EXE")"
          echo "  exe is executable: $([ -x "$EXE" ] && echo YES || echo NO)"
          echo "  marker dir exists: $([ -d "$MARKER_DIR" ] && echo YES || echo NO)"
          echo "  marker dir perms: $(ls -ld "$MARKER_DIR")"
          echo "  publish dir perms: $(ls -ld "$PUBLISH_DIR")"
          echo "  running as: $(whoami) (sudo target: $(sudo whoami))"
          echo ""

          # ── Start with full output ──
          echo "=== Start ==="
          sudo "$EXE" start 2>&1 | tee /tmp/svc-start.log
          START_RC=${PIPESTATUS[0]}
          echo "  start exit code: $START_RC"
          echo ""

          # ── Diagnostics: post-start state ──
          echo "=== Post-start process check ==="
          sleep 2
          ps aux | grep -i "[S]erviceCwdTest" || echo "  No ServiceCwdTest process found!"
          echo ""
          echo "  PID file /run/$SERVICE_NAME.pid:"
          sudo cat "/run/$SERVICE_NAME.pid" 2>/dev/null || echo "  (not found)"
          echo ""

          # Service status
          echo "=== Service status ==="
          if command -v systemctl &>/dev/null; then
            sudo systemctl status "$SERVICE_NAME" --no-pager 2>&1 || true
          elif command -v rc-service &>/dev/null; then
            sudo rc-service "$SERVICE_NAME" status 2>&1 || true
          fi
          echo ""

          # Wait for marker (30s)
          echo "=== Waiting for marker (30s) ==="
          for i in $(seq 1 30); do
            [ -f "$MARKER_FILE" ] && break
            sleep 1
          done

          if [ ! -f "$MARKER_FILE" ]; then
            echo "FAIL: Marker file not found after 30s"
            echo ""

            # ── Failure diagnostics ──
            echo "=== Failure diagnostics ==="

            echo "--- Process state ---"
            ps aux | grep -i "[S]erviceCwdTest" || echo "  No process running"
            ps aux | grep -i "[s]eashell" || echo "  No seashell processes"
            echo ""

            echo "--- Marker directory listing ---"
            ls -laR "$MARKER_DIR" 2>/dev/null || echo "  directory missing"
            echo ""

            echo "--- Publish directory listing ---"
            ls -la "$PUBLISH_DIR/" 2>/dev/null | head -20 || true
            echo ""

            echo "--- Service logs (journalctl) ---"
            sudo journalctl -u "$SERVICE_NAME" --no-pager -n 50 2>/dev/null || echo "  journalctl not available"
            echo ""

            echo "--- Service logs (syslog/messages) ---"
            sudo grep -i "$SERVICE_NAME\|ServiceCwdTest" /var/log/messages 2>/dev/null | tail -30 || true
            sudo grep -i "$SERVICE_NAME\|ServiceCwdTest" /var/log/syslog 2>/dev/null | tail -30 || true
            echo ""

            echo "--- OpenRC log ---"
            sudo cat "/var/log/$SERVICE_NAME.log" 2>/dev/null || echo "  no OpenRC log file"
            echo ""

            echo "--- dmesg (recent, segfaults/killed) ---"
            sudo dmesg | tail -20 2>/dev/null || true
            echo ""

            echo "--- Trying to run binary directly (5s timeout) ---"
            cd /
            sudo timeout 5 "$EXE" 2>&1 || echo "  direct run exit code: $?"
            cd - >/dev/null
            echo ""

            echo "--- OpenRC net service status ---"
            rc-service --list 2>/dev/null | head -20 || true
            rc-status 2>/dev/null || true
            echo ""

            sudo "$EXE" stop || true
            sudo "$EXE" uninstall || true
            exit 1
          fi

          echo "SUCCESS: marker file found"
          cat "$MARKER_FILE"
          grep -q "Script=" "$MARKER_FILE" || { echo "Missing Script= in marker"; exit 1; }
          grep -q "NuGet=" "$MARKER_FILE" || { echo "Missing NuGet= in marker"; exit 1; }
          ! grep -q "NuGet=FAIL" "$MARKER_FILE" || { echo "NuGet=FAIL in marker"; exit 1; }

          sudo "$EXE" stop || true
          sleep 3
          sudo "$EXE" uninstall || true

      - name: "Test: service-identity (NuGet cache isolation)"

        run: |
          PUBLISH_DIR="./artifacts/service-cwd-test"
          MARKER_DIR="$PUBLISH_DIR/markers"
          MARKER_FILE="$MARKER_DIR/seashell-cwd-test.marker"
          SERVICE_NAME="seashell-cwd-test"

          if [ "${{ matrix.os }}" = "windows" ]; then
            EXE="$PUBLISH_DIR/ServiceCwdTest.exe"
            ELEVATE=""
          else
            EXE="$PUBLISH_DIR/ServiceCwdTest"
            ELEVATE="sudo"
          fi

          [ -f "$EXE" ] || { echo "ServiceCwdTest binary not found"; exit 1; }

          service_running() {
            if [ "${{ matrix.os }}" = "windows" ]; then
              sc.exe query "$SERVICE_NAME" 2>/dev/null | grep -qE 'RUNNING|PENDING'
            else
              pgrep -f "service-cwd-test/ServiceCwdTest" >/dev/null
            fi
          }

          # `install` also starts the service, as LocalSystem / root — which has
          # a SeaShell install, so it writes the marker. Stop it and wait, and
          # only then delete the marker and switch the account.
          # No compile-cache clearing: caches are per identity and version
          # ({DataDir}/v{version}/cache of the account whose daemon compiles),
          # and the alternate account below has no SeaShell install, so it has
          # no cache to clear; LocalSystem's / root's does not decide whether
          # the alternate account's run writes a marker.
          if [ "${{ matrix.os }}" = "windows" ]; then
            # The previous step deleted this service; creating it again fails
            # with 1072 until that deletion has completed.
            for i in $(seq 1 30); do sc.exe query "$SERVICE_NAME" >/dev/null 2>&1 || break; sleep 1; done
          fi
          $ELEVATE "$EXE" install || true
          $ELEVATE "$EXE" stop || true
          for i in $(seq 1 30); do service_running || break; sleep 1; done
          if service_running; then echo "WARNING: $SERVICE_NAME still running 30s after stop"; fi
          rm -f "$MARKER_FILE"

          if [ "${{ matrix.os }}" = "windows" ]; then
            $ELEVATE sc.exe config "$SERVICE_NAME" obj= "NT AUTHORITY\NetworkService" password= ""
          else
            # BusyBox `adduser -S` creates no group of the user's name, which
            # the OpenRC command_user="user:group" below needs: create it first.
            sudo useradd -r -M -s /usr/sbin/nologin seashell-test-user 2>/dev/null \
              || { sudo addgroup -S seashell-test-user 2>/dev/null; sudo adduser -S -D -H -s /sbin/nologin -G seashell-test-user seashell-test-user 2>/dev/null; } \
              || true
            if [ -f "/etc/systemd/system/$SERVICE_NAME.service" ]; then
              sudo sed -i "s/^User=.*/User=seashell-test-user/" /etc/systemd/system/$SERVICE_NAME.service
              sudo systemctl daemon-reload
            elif [ -f "/etc/init.d/$SERVICE_NAME" ]; then
              sudo sed -i 's/^command_user=.*/command_user="seashell-test-user:seashell-test-user"/' /etc/init.d/$SERVICE_NAME
            fi
          fi

          $ELEVATE "$EXE" start || echo "NOTICE: start under the alternate account exited $?"
          sleep 2
          # Which account the service now runs as, so a run that never started
          # under it is visible rather than read as "isolation confirmed".
          if [ "${{ matrix.os }}" = "windows" ]; then
            sc.exe qc "$SERVICE_NAME" | grep -i SERVICE_START_NAME || true
            sc.exe query "$SERVICE_NAME" | grep -i STATE || true
          else
            PIDS=$(pgrep -f "service-cwd-test/ServiceCwdTest" || true)
            if [ -n "$PIDS" ]; then
              for p in $PIDS; do echo "  ServiceCwdTest pid $p runs as $(stat -c %U "/proc/$p" 2>/dev/null || echo '?')"; done
            else
              echo "  no ServiceCwdTest process (exited or never started)"
            fi
          fi

          # Wait 20s — expect no marker (cache isolation)
          for i in $(seq 1 20); do
            [ -f "$MARKER_FILE" ] && break
            sleep 1
          done

          if [ -f "$MARKER_FILE" ]; then
            echo "NOTICE: Service ran under alternate identity (cache not isolated)"
          else
            echo "No marker after 20s — cache isolation confirmed"
          fi

          $ELEVATE "$EXE" stop || true
          sleep 2
          $ELEVATE "$EXE" uninstall || true
          if [ "${{ matrix.os }}" = "linux" ]; then
            sudo userdel seashell-test-user 2>/dev/null \
              || sudo deluser seashell-test-user 2>/dev/null \
              || true
            sudo delgroup seashell-test-user 2>/dev/null || true
          fi

      # ── Restart tests ──────────────────────────────────────────────

      - name: "Test: restart daemon before restart tests"

        run: |
          sea --daemon-stop || true
          sleep 2

      - name: "Test: restart_test.cs"
        run: sea test/restart_test.cs

      - name: "Test: restart_opt_out_test.cs"
        run: sea test/restart_opt_out_test.cs

      - name: "Test: watch_restart_test.cs (//sea_restart in watch mode)"
        run: |
          OUT=$(sea test/watch_restart_test.cs)
          echo "$OUT"
          echo "$OUT" | grep -q "reached count=2" || { echo "watch session ended without restarting"; exit 1; }

      # ── Mutex tests ────────────────────────────────────────────────

      - name: "Test: mutex (second instance blocked, exits 200)"

        run: |
          sea test/mutex_test.cs &
          PID=$!
          sleep 3
          set +e
          sea test/mutex_test.cs
          CODE=$?
          set -e
          wait $PID || true
          [ "$CODE" -eq 200 ] || { echo "Expected exit 200, got $CODE"; exit 1; }

      - name: "Test: mutex_attach (second instance communicates with first)"

        run: |
          sea test/mutex_attach_test.cs &
          PID=$!
          sleep 5
          sea test/mutex_attach_test.cs test-arg-1 test-arg-2 || true
          wait $PID
          # First instance should exit 0 after receiving attach

      - name: "Test: mutex user scope (second instance blocked)"

        run: |
          sea test/mutex_user_test.cs &
          PID=$!
          sleep 3
          set +e
          sea test/mutex_user_test.cs
          CODE=$?
          set -e
          wait $PID || true
          [ "$CODE" -eq 200 ] || { echo "Expected exit 200, got $CODE"; exit 1; }

      - name: "Test: mutex session scope (Windows only)"
        if: matrix.os == 'windows'
        shell: powershell
        run: |
          $proc1 = Start-Process -FilePath "sea" -ArgumentList "test/mutex_session_test.cs" -PassThru -RedirectStandardOutput "$env:TEMP\sea-mutex-out.log" -RedirectStandardError "$env:TEMP\sea-mutex-err.log"
          Start-Sleep -Seconds 3

          # Same session — should be blocked (exit 200)
          $proc2 = Start-Process -FilePath "sea" -ArgumentList "test/mutex_session_test.cs" -PassThru -Wait
          if ($proc2.ExitCode -ne 200) {
            Write-Host "Same-session: expected 200, got $($proc2.ExitCode)"
            $proc1 | Stop-Process -Force -ErrorAction SilentlyContinue
            exit 1
          }
          Write-Host "Same session blocked (200)"

          # Different session via pre-created scheduled task (batch logon → new session ID)
          $cwd = Get-Location
          $markerPath = Join-Path $cwd 'artifacts\session_marker.txt'
          Remove-Item $markerPath -Force -ErrorAction SilentlyContinue
          $seaPath = (Get-Command sea).Source
          $scriptPath = (Resolve-Path 'test/mutex_session_test.cs').Path
          $taskName = 'mutex_session_scope_out_session'
          $batPath = 'C:\Install\act_runner\mutex_session_scope_out_session.bat'

          # Write the .bat file with the sea command for this run
          $cmdLine = ('"' + $seaPath + '" "' + $scriptPath + '" "' + $markerPath + '"')
          [System.IO.File]::WriteAllText($batPath, $cmdLine)
          Write-Host ('  Bat content: ' + $cmdLine)

          schtasks /Run /TN $taskName

          # Wait for marker — proc1 holds mutex for 30s
          $found = $false
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Milliseconds 500
            if (Test-Path $markerPath) { $found = $true; break }
          }

          # Diagnostics
          Write-Host '=== Task status ==='
          schtasks /Query /TN $taskName /V /FO LIST 2>$null | Select-String 'Status|Result|Run'
          Write-Host '=== proc1 still running? ==='
          if ($proc1.HasExited) { Write-Host ('  No (exited ' + $proc1.ExitCode + ')') } else { Write-Host '  Yes (mutex still held)' }

          $proc1 | Stop-Process -Force -ErrorAction SilentlyContinue

          # End orphaned sea/daemon processes spawned by the task: the runner
          # account's only, not the SYSTEM daemon nor another user's.
          $ErrorActionPreference = 'Continue'
          & ([scriptblock]::Create($env:SEASHELL_CI_CLEANUP_PS1)) -Apply -UserOnly -Names sea.exe, seashell-daemon.exe
          $ErrorActionPreference = 'Stop'

          if (-not $found) {
            Write-Host 'Different-session instance did not run'
            exit 1
          }
          if ($proc1.HasExited -and $proc1.ExitCode -eq 0) {
            Write-Host 'WARN: proc1 exited before task — timing inconclusive'
          }
          Write-Host 'Different session free'

      # ── Window mode tests (Windows only) ───────────────────────────

      - name: "Test: seaw window mode (no console)"
        if: matrix.os == 'windows'
        shell: powershell
        run: |
          $seawExe = Join-Path $env:LOCALAPPDATA 'seashell\current\bin\seaw.exe'
          if (-not (Test-Path $seawExe)) { Write-Host ('seaw.exe not found: ' + $seawExe); exit 1 }
          Write-Host ('  Using: ' + $seawExe)

          $markerPath = (Join-Path (Get-Location) 'artifacts\seaw_window_marker.txt')
          $scriptPath = (Resolve-Path 'test/seaw_window_test.csw').Path
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Remove-Item $markerPath -Force -ErrorAction SilentlyContinue

          # Run via Task Scheduler — the real deployment context for seaw.exe
          $taskName = 'SeaShell_SeawWindowTest'
          $ErrorActionPreference = 'SilentlyContinue'
          schtasks /Delete /TN $taskName /F 2>&1 | Out-Null
          $ErrorActionPreference = 'Stop'
          $tr = ('"' + $seawExe + '" "' + $scriptPath + '" "' + $markerPath + '"')
          schtasks /Create /TN $taskName /TR $tr /SC ONCE /ST 00:00 /F /RU "$env:USERNAME"
          schtasks /Run /TN $taskName

          $found = $false
          for ($i = 0; $i -lt 120; $i++) {
            Start-Sleep -Milliseconds 250
            if (Test-Path $markerPath) { $found = $true; break }
          }

          $ErrorActionPreference = 'SilentlyContinue'
          schtasks /Delete /TN $taskName /F 2>&1 | Out-Null
          $ErrorActionPreference = 'Stop'

          # Dump SeaShell Event Log entries for diagnostics
          Write-Host '=== Event Log (SeaShell) ==='
          Get-WinEvent -FilterHashtable @{LogName='Application';ProviderName='SeaShell';StartTime=(Get-Date).AddMinutes(-2)} -MaxEvents 5 -ErrorAction SilentlyContinue | Format-List TimeCreated, Message

          if (-not $found) { Write-Host 'Marker file not created'; exit 1 }
          Write-Host '=== Marker file ==='
          Get-Content $markerPath
          $result = (Get-Content $markerPath)[-1]
          if ($result -ne 'PASS') { Write-Host ('Test failed: ' + $result); exit 1 }
          Write-Host 'seaw window mode OK'

      - name: "Test: seaw console mode (//sea_console)"
        if: matrix.os == 'windows'
        shell: powershell
        run: |
          $seawExe = Join-Path $env:LOCALAPPDATA 'seashell\current\bin\seaw.exe'
          if (-not (Test-Path $seawExe)) { Write-Host ('seaw.exe not found: ' + $seawExe); exit 1 }

          $markerPath = (Join-Path (Get-Location) 'artifacts\seaw_console_marker.txt')
          $scriptPath = (Resolve-Path 'test/seaw_console_test.csw').Path
          Remove-Item $markerPath -Force -ErrorAction SilentlyContinue

          $taskName = 'SeaShell_ConsoleTest'
          $ErrorActionPreference = 'SilentlyContinue'
          schtasks /Delete /TN $taskName /F 2>&1 | Out-Null
          $ErrorActionPreference = 'Stop'
          $tr = ('"' + $seawExe + '" "' + $scriptPath + '" "' + $markerPath + '"')
          schtasks /Create /TN $taskName /TR $tr /SC ONCE /ST 00:00 /F /RU "$env:USERNAME"
          schtasks /Run /TN $taskName

          $found = $false
          for ($i = 0; $i -lt 120; $i++) {
            Start-Sleep -Milliseconds 250
            if (Test-Path $markerPath) { $found = $true; break }
          }

          $ErrorActionPreference = 'SilentlyContinue'
          schtasks /Delete /TN $taskName /F 2>&1 | Out-Null
          $ErrorActionPreference = 'Stop'

          if (-not $found) { Write-Host 'Marker not created'; exit 1 }
          Write-Host '=== Marker file ==='
          Get-Content $markerPath
          $result = (Get-Content $markerPath)[-1]
          if ($result -ne 'PASS') { Write-Host ('Test failed: ' + $result); exit 1 }
          Write-Host 'seaw console mode OK'

      # ── Elevator (Windows only) ────────────────────────────────────
      # The elevator task and the Event Log source are registered by
      # `seashell install --all` (Phase 1); "Install: Verify (Windows)"
      # checks the elevator task.

      - name: "Test: elevator connects to daemon"
        if: matrix.os == 'windows'

        run: |
          sea --daemon-start
          sleep 2
          sea --start
          sleep 3
          sea --status || true
          # Elevator may not connect in CI session — don't fail hard

      # SeaConsole relay tests require UAC (elevator path). CI runner has UAC off,
      # so //sea_elevate takes the direct path — relay is never exercised.
      # These tests must be run manually on a machine with UAC enabled.

      - name: "Test: seaw Event Log error (malformed script)"
        if: matrix.os == 'windows'
        shell: powershell
        run: |
          $seawExe = Join-Path $env:LOCALAPPDATA 'seashell\current\bin\seaw.exe'
          if (-not (Test-Path $seawExe)) { Write-Host ('seaw.exe not found: ' + $seawExe); exit 1 }

          $scriptPath = (Resolve-Path 'test/seaw_eventlog_test.csw').Path
          $beforeTime = [DateTime]::UtcNow

          # Run via Task Scheduler so seaw has no console — errors go to Event Log
          $taskName = 'SeaShell_EventLogTest'
          $ErrorActionPreference = 'SilentlyContinue'
          schtasks /Delete /TN $taskName /F 2>&1 | Out-Null
          $ErrorActionPreference = 'Stop'
          $tr = ('"' + $seawExe + '" "' + $scriptPath + '"')
          schtasks /Create /TN $taskName /TR $tr /SC ONCE /ST 00:00 /F /RU "$env:USERNAME"
          schtasks /Run /TN $taskName

          # Wait for task to complete
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Milliseconds 500
            $state = (schtasks /Query /TN $taskName /FO CSV /NH 2>$null) -split ',' | Select-Object -Index 2
            if ($state) { $state = $state.Trim('"') }
            if ($state -eq 'Ready') { break }
          }

          $ErrorActionPreference = 'SilentlyContinue'
          schtasks /Delete /TN $taskName /F 2>&1 | Out-Null
          $ErrorActionPreference = 'Stop'
          Start-Sleep -Seconds 1

          $events = Get-WinEvent -FilterHashtable @{LogName='Application';ProviderName='SeaShell';StartTime=$beforeTime.ToLocalTime()} -MaxEvents 10 -ErrorAction SilentlyContinue
          # Also check Application source with [SeaShell] prefix
          $events2 = Get-WinEvent -FilterHashtable @{LogName='Application';ProviderName='Application';StartTime=$beforeTime.ToLocalTime()} -MaxEvents 20 -ErrorAction SilentlyContinue |
            Where-Object { $_.Message -match '\[SeaShell\]' }
          $allEvents = @($events) + @($events2) | Where-Object { $_ -ne $null }
          $errorEvent = $allEvents | Where-Object { $_.Message -match 'fail|error' } | Select-Object -First 1

          if ($errorEvent) {
            Write-Host ('EventLog entry found: ' + $errorEvent.ProviderName + ' — ' + $errorEvent.Message.Substring(0, [Math]::Min(200, $errorEvent.Message.Length)))
          } else {
            Write-Host 'No SeaShell error in Event Log'
            Write-Host '=== Recent SeaShell events ==='
            $allEvents | Format-List TimeCreated, ProviderName, Message
            exit 1
          }

      # ── Lifecycle tests ────────────────────────────────────────────

      - name: "Test: daemon status (no crash)"

        run: sea --status || true

      - name: "Test: daemon socket permissions (Linux)"
        if: matrix.os == 'linux'

        run: |
          XDG_DIR="${XDG_RUNTIME_DIR:-/tmp}"
          # 0.6.0+: the identity token in socket names is the uid, not the username
          IDENTITY=$(id -u)
          SOCKET=$(ls "$XDG_DIR"/seashell-*-"$IDENTITY".sock 2>/dev/null | head -1)

          if [ -z "$SOCKET" ]; then
            echo "No daemon socket found in $XDG_DIR"
            exit 1
          fi

          PERMS=$(stat -c '%a' "$SOCKET")
          echo "Socket permissions: $PERMS"
          # Should be 600 (owner only)
          [ "$PERMS" = "600" ] || { echo "Insecure permissions: $PERMS"; exit 1; }

      - name: "Test: daemon stop"

        run: sea --stop

      - name: "Test: daemon stop (idempotent)"

        run: sea --stop

      # ── Bootstrapper lifecycle (Windows only) ──────────────────────

      - name: "Test: seashell start (starts daemon + elevator)"
        if: matrix.os == 'windows'

        run: |
          sea --stop || true
          sleep 2
          seashell start
          sleep 5
          sea --status | grep -q ", up " || { echo "Daemon not running"; exit 1; }

      - name: "Test: seashell stop (stops both)"
        if: matrix.os == 'windows'

        run: |
          seashell stop
          sleep 3
          ! sea --status 2>&1 | grep -q ", up " || { echo "Daemon still running"; exit 1; }

      - name: "Test: --status shows task state when daemon is down"
        if: matrix.os == 'windows'

        run: |
          sea --stop || true
          sleep 2
          OUTPUT=$(sea --status 2>&1 || true)
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -qE "(task |not running)" || { echo "Unexpected status output"; exit 1; }

      # ── Schedule tests (Windows) ───────────────────────────────────

      - name: "Test: schedule daily (Windows)"
        if: matrix.os == 'windows'

        run: sea --schedule "test/schedule_marker_test.cs" daily at 09:00

      - name: "Test: schedule weekly multi-day (Windows)"
        if: matrix.os == 'windows'

        run: sea --schedule "test/schedule_marker_test.cs" weekly on mon,wed,fri at 08:00

      - name: "Test: schedule every 5 minutes (Windows)"
        if: matrix.os == 'windows'

        run: sea --schedule "test/schedule_marker_test.cs" every 5 minutes at 01:00 for 8 hours

      - name: "Test: schedule @reboot (Windows)"
        if: matrix.os == 'windows'

        run: sea --schedule "test/schedule_marker_test.cs" @reboot

      - name: "Test: schedule @logon (Windows)"
        if: matrix.os == 'windows'

        run: sea --schedule "test/schedule_marker_test.cs" @logon

      - name: "Test: schedule overwrite (Windows)"
        if: matrix.os == 'windows'

        run: |
          sea --schedule "test/schedule_marker_test.cs" daily at 09:00
          sea --schedule "test/schedule_marker_test.cs" weekly on tue,thu at 14:30

      - name: "Test: unschedule (Windows)"
        if: matrix.os == 'windows'

        run: sea --unschedule "test/schedule_marker_test.cs"

      - name: "Test: unschedule nonexistent (Windows)"
        if: matrix.os == 'windows'

        run: |
          set +e
          sea --unschedule "test/nonexistent_script.cs"
          CODE=$?
          set -e
          [ "$CODE" -ne 0 ] || { echo "Should have failed"; exit 1; }

      - name: "Test: schedule invalid timing (Windows)"
        if: matrix.os == 'windows'

        run: |
          set +e
          sea --schedule "test/schedule_marker_test.cs" biweekly on neptune
          CODE=$?
          set -e
          [ "$CODE" -ne 0 ] || { echo "Should have failed"; exit 1; }

      - name: "Test: schedule --list (Windows)"
        if: matrix.os == 'windows'

        run: |
          sea --schedule "test/schedule_marker_test.cs" @logon
          sea --schedule-list | grep -q "schedule_marker_test"

      - name: "Test: schedule trigger (Windows)"
        if: matrix.os == 'windows'
        shell: powershell
        run: |
          $markerPath = "test/schedule_marker.txt"
          Remove-Item $markerPath -Force -ErrorAction SilentlyContinue

          sea --schedule "test/schedule_marker_test.cs" "@logon"
          $taskPath = "\SeaShell\$env:USERNAME - schedule_marker_test"
          schtasks /Run /TN "$taskPath"

          $found = $false
          for ($i = 0; $i -lt 120; $i++) {
            Start-Sleep -Milliseconds 250
            if (Test-Path $markerPath) { $found = $true; break }
          }

          Remove-Item $markerPath -Force -ErrorAction SilentlyContinue
          if (-not $found) { Write-Host "Marker not created"; exit 1 }
          Write-Host "Schedule trigger OK"

      # ── Schedule tests (Linux) ─────────────────────────────────────

      - name: "Test: schedule daily (Linux)"
        if: matrix.os == 'linux'

        run: |
          sea --schedule "test/schedule_marker_test.cs" daily at 09:00
          crontab -l | grep -q "schedule_marker_test"

      - name: "Test: schedule overwrite (Linux)"
        if: matrix.os == 'linux'

        run: |
          sea --schedule "test/schedule_marker_test.cs" daily at 09:00
          sea --schedule "test/schedule_marker_test.cs" weekly on mon at 14:00
          COUNT=$(crontab -l | grep -c "# seashell:schedule_marker_test")
          [ "$COUNT" -eq 1 ] || { echo "Expected 1 entry, got $COUNT"; exit 1; }

      - name: "Test: unschedule (Linux)"
        if: matrix.os == 'linux'

        run: |
          sea --unschedule "test/schedule_marker_test.cs"
          ! crontab -l 2>/dev/null | grep -q "schedule_marker_test" || { echo "Entry still exists"; exit 1; }

      - name: "Test: unschedule nonexistent (Linux)"
        if: matrix.os == 'linux'

        run: |
          set +e
          sea --unschedule "test/nonexistent_script.cs"
          CODE=$?
          set -e
          [ "$CODE" -ne 0 ] || { echo "Should have failed"; exit 1; }

      - name: "Test: schedule @logon on Linux (proper error)"
        if: matrix.os == 'linux'

        run: |
          set +e
          OUTPUT=$(sea --schedule "test/schedule_marker_test.cs" @logon 2>&1)
          CODE=$?
          set -e
          [ "$CODE" -ne 0 ] || { echo "Should have failed"; exit 1; }
          echo "$OUTPUT" | grep -qi "not supported" || { echo "Expected 'not supported' error"; exit 1; }

      # ── Phase 3: Install tests ─────────────────────────────────────
      # On the installed build, after the functional tests: update (same
      # version: up to date, nothing restarted), automatic updates on / run /
      # off, and uninstall of the whole remembered scope. The installed copy
      # (current/bin/seashell, no archive of its own) is called by its full
      # path. The uninstall leaves the runner without SeaShell; "Final"
      # reinstalls it.

      - name: "Install test: update reports up to date"

        run: |
          VERSION="${{ needs.version.outputs.version }}"
          if [ "${{ matrix.os }}" = "windows" ]; then
            DATA="$(cygpath -u "$LOCALAPPDATA")/seashell"
            SEASHELL="$DATA/current/bin/seashell.exe"
            FEED="$(cygpath -m "$(pwd)/nupkg")"
            pids() { powershell -NoProfile -Command "(@(Get-Process seashell-daemon,seashell-elevator -ErrorAction SilentlyContinue | ForEach-Object { \$_.Id }) | Sort-Object) -join ' '" | tr -d '\r'; }
          else
            DATA="${XDG_DATA_HOME:-$HOME/.local/share}/seashell"
            SEASHELL="$DATA/current/bin/seashell"
            FEED="$(pwd)/nupkg"
            pids() { (pgrep -f seashell-daemon || true) | sort -n | tr '\n' ' ' | sed 's/ *$//'; }
          fi
          fail() { echo "FAIL: $*"; exit 1; }

          # A running daemon, so that a restart shows up as a different pid.
          sea --start || true
          STATUS=""
          for i in $(seq 1 15); do
            STATUS=$(sea --status 2>&1) || true
            grep -q ", up " <<< "$STATUS" && break
            sleep 1
          done
          grep -q ", up " <<< "$STATUS" || { echo "$STATUS"; fail "daemon not running before the update"; }

          SCOPE_BEFORE=$(cat "$DATA/install.scope")
          MTIME_BEFORE=$(stat -c %Y "$DATA/install.scope")
          PIDS_BEFORE=$(pids)
          echo "daemon/elevator pids before: $PIDS_BEFORE"
          [ -n "$PIDS_BEFORE" ] || fail "no daemon process found"
          sleep 1   # an install.scope rewrite must show in its 1-second mtime

          CODE=0
          OUT=$("$SEASHELL" update --source "$FEED" 2>&1) || CODE=$?
          echo "$OUT"
          [ "$CODE" -eq 0 ] || fail "seashell update exited $CODE"
          grep -qF "Up to date (v$VERSION)" <<< "$OUT" || fail "no 'Up to date (v$VERSION)' in the output"
          [ "$(cat "$DATA/install.scope")" = "$SCOPE_BEFORE" ] || fail "install.scope content changed"
          [ "$(stat -c %Y "$DATA/install.scope")" = "$MTIME_BEFORE" ] || fail "install.scope was rewritten"
          PIDS_AFTER=$(pids)
          echo "daemon/elevator pids after:  $PIDS_AFTER"
          [ "$PIDS_AFTER" = "$PIDS_BEFORE" ] || fail "daemon/elevator restarted (before: $PIDS_BEFORE, after: $PIDS_AFTER)"
          echo "OK: up to date, install.scope untouched, nothing restarted"

      - name: "Install test: automatic updates on, run, off (Windows)"
        if: matrix.os == 'windows'
        shell: powershell
        run: |
          $version = '${{ needs.version.outputs.version }}'
          $seashell = Join-Path $env:LOCALAPPDATA 'seashell\current\bin\seashell.exe'
          $feed = Join-Path (Get-Location).Path 'nupkg'
          $names = @("SeaShell Update ($env:USERNAME)", 'SeaShell Update (SYSTEM)')
          $failed = $false
          function Fail($m) { Write-Host "FAIL: $m"; $script:failed = $true }
          function Find-Task($name) { Get-ScheduledTask -TaskPath '\SeaShell\' -TaskName $name -ErrorAction SilentlyContinue }

          # The SYSTEM task records a dotnet under %ProgramFiles% (doc/SECURITY.md).
          # With only a per-user SDK it is refused: exit 3, the user's task is on.
          # Either outcome is correct; say which.
          $out = & $seashell update --auto on --source $feed 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $out
          $passes = @('user', 'system')
          if ($code -eq 0) {
            Write-Host "OUTCOME: SYSTEM task created"
            $sysArgs = "$((Find-Task 'SeaShell Update (SYSTEM)').Actions[0].Arguments)"
            Write-Host "SYSTEM task arguments: $sysArgs"
            if ($sysArgs -notmatch [regex]::Escape("--dotnet `"$env:ProgramFiles\")) { Fail "the SYSTEM task does not record a dotnet under $env:ProgramFiles" }
          } elseif ($code -eq 3) {
            Write-Host "OUTCOME: SYSTEM task refused (no .NET SDK under $env:ProgramFiles on this runner)"
            if ($out -notmatch 'the SYSTEM entry was not created') { Fail "exit 3 without the documented 'the SYSTEM entry was not created' message" }
            if ($out -notmatch 'Install the \.NET 10 SDK machine-wide') { Fail "exit 3 without saying what to do" }
            if (Find-Task 'SeaShell Update (SYSTEM)') { Fail "the SYSTEM task was refused, but \SeaShell\SeaShell Update (SYSTEM) exists" }
            $names = @($names | Where-Object { $_ -ne 'SeaShell Update (SYSTEM)' })
            $passes = @('user')
          } else { Fail "update --auto on exited $code" }
          $registered = @($names | Where-Object { Find-Task $_ })
          foreach ($n in $names) { if ($registered -contains $n) { Write-Host "OK: \SeaShell\$n registered" } else { Fail "\SeaShell\$n not registered" } }
          $status = & $seashell status | Out-String
          Write-Host $status
          $expected = if ($code -eq 3) { 'Auto-update\s+on; SYSTEM: off' } else { 'Auto-update\s+on; SYSTEM: on' }
          if ($status -notmatch $expected) { Fail "seashell status does not show '$expected'" }

          # Run each task once, as Task Scheduler would, and wait for it to finish.
          $start = (Get-Date).AddSeconds(-2)
          foreach ($n in $registered) {
            schtasks /Run /TN "\SeaShell\$n"
            if ($LASTEXITCODE -ne 0) { Fail "schtasks /Run \SeaShell\$n exited $LASTEXITCODE" }
          }
          foreach ($n in $registered) {
            $info = $null
            for ($i = 0; $i -lt 180; $i++) {
              Start-Sleep -Seconds 1
              $task = Find-Task $n
              $info = $task | Get-ScheduledTaskInfo
              if ($info.LastRunTime -ge $start -and $task.State -ne 'Running' -and $task.State -ne 'Queued') { break }
              $info = $null
            }
            if (-not $info) { Fail "\SeaShell\$n did not run to completion within 180s"; continue }
            if ($info.LastTaskResult -ne 0) { Fail "\SeaShell\$($n): last result $($info.LastTaskResult)" }
            else { Write-Host "OK: \SeaShell\$n ran, result 0" }
          }

          # Every scheduled run appends its outcome to update.log in the data directory.
          $log = Join-Path $env:LOCALAPPDATA 'seashell\update.log'
          $last = @(Get-Content $log -ErrorAction SilentlyContinue | Where-Object { $_ -like '=== *' }) | Select-Object -Last 1
          Write-Host "user update.log: $last"
          if ($last -notmatch ' exit 0 nothing$') { Fail "$($log): no 'exit 0 nothing' entry from the user run" }

          # A quiet up-to-date run leaves one Event Log entry per target (source SeaShell, id 3000).
          $events = @(Get-WinEvent -FilterHashtable @{ LogName = 'Application'; ProviderName = 'SeaShell'; Id = 3000; StartTime = $start } -ErrorAction SilentlyContinue)
          $events | ForEach-Object { Write-Host "  [$($_.TimeCreated)] $($_.Message)" }
          foreach ($pass in $passes) {
            if ($events | Where-Object { $_.Message -match "SeaShell up to date .*--pass $pass" }) { Write-Host "OK: '$pass' run reported up to date" }
            else { Fail "no 'SeaShell up to date' Event Log entry for --pass $pass" }
          }

          & $seashell update --auto off
          if ($LASTEXITCODE -ne 0) { Fail "update --auto off exited $LASTEXITCODE" }
          foreach ($n in $names) { if (Find-Task $n) { Fail "\SeaShell\$n still registered after --auto off" } }
          $status = & $seashell status | Out-String
          Write-Host $status
          if ($status -notmatch 'Auto-update\s+off.*; SYSTEM: off') { Fail "seashell status does not show automatic updates off" }
          if ($failed) { exit 1 }

      - name: "Install test: automatic updates on, run, off (Linux)"
        if: matrix.os == 'linux'

        run: |
          DATA="${XDG_DATA_HOME:-$HOME/.local/share}/seashell"
          SEASHELL="$DATA/current/bin/seashell"
          FEED="$(pwd)/nupkg"
          TAG='# seashell-auto-update'
          FAILED=0
          fail() { echo "FAIL: $*"; FAILED=1; }
          user_lines() { (crontab -l 2>/dev/null || true) | grep -F "$TAG" || true; }
          root_lines() { (sudo crontab -l 2>/dev/null || true) | grep -F "$TAG" || true; }
          START=$(date +%s)

          # Root's line records a dotnet only root can change (doc/SECURITY.md).
          # With a per-user SDK and no machine-wide one, root's entry is refused:
          # exit 3, the user's entry is on. Either outcome is correct; say which.
          CODE=0
          OUT=$("$SEASHELL" update --auto on --source "$FEED" 2>&1) || CODE=$?
          echo "$OUT"
          USER_LINE=$(user_lines)
          ROOT_LINE=$(root_lines)
          echo "user: $USER_LINE"
          echo "root: $ROOT_LINE"
          [ "$(grep -c . <<< "$USER_LINE" || true)" = "1" ] || fail "user crontab: expected one line tagged '$TAG'"
          case "$CODE" in
            0)
              echo "OUTCOME: root entry created"
              [ "$(grep -c . <<< "$ROOT_LINE" || true)" = "1" ] || fail "root crontab: expected one line tagged '$TAG'"
              if grep -oE "PATH=[^ ]+" <<< "$ROOT_LINE" | grep -qF "$HOME"; then fail "root's line carries a PATH entry under $HOME"; fi
              ;;
            3)
              echo "OUTCOME: root entry refused (no machine-wide .NET SDK on this runner)"
              grep -qF "the root entry was not created" <<< "$OUT" || fail "exit 3 without the documented 'the root entry was not created' message"
              grep -qF "Install the .NET 10 SDK machine-wide" <<< "$OUT" || fail "exit 3 without saying what to do"
              [ -z "$ROOT_LINE" ] || fail "root's entry was refused, but root's crontab has a '$TAG' line"
              ;;
            *) fail "update --auto on exited $CODE" ;;
          esac
          STATUS=$("$SEASHELL" status 2>&1) || true
          echo "$STATUS"
          grep -qE 'Auto-update +on' <<< "$STATUS" || fail "seashell status does not show automatic updates on"

          # Run each line's command as cron would: /bin/sh, an empty
          # environment (the line sets HOME, DOTNET_ROOT and PATH itself), cwd /.
          # A quiet run prints nothing unless it installed something or failed.
          run_line() {
            local who=$1 line=$2 cmd out code=0
            [ -n "$line" ] || return 0
            cmd=$(cut -d' ' -f6- <<< "$line")
            echo "Running the $who entry: $cmd"
            if [ "$who" = root ]; then
              out=$(cd / && sudo env -i /bin/sh -c "$cmd" 2>&1) || code=$?
            else
              out=$(cd / && env -i /bin/sh -c "$cmd" 2>&1) || code=$?
            fi
            [ -z "$out" ] || echo "$out"
            [ "$code" -eq 0 ] || { fail "$who entry exited $code"; return 0; }
            [ -z "$out" ] || { fail "$who entry printed output: a quiet up-to-date run prints nothing"; return 0; }
            echo "OK: $who entry exited 0, nothing to do"
          }
          run_line user "$USER_LINE"
          run_line root "$ROOT_LINE"

          # Every scheduled run appends its outcome to update.log in the data directory.
          LAST=$(grep '^=== ' "$DATA/update.log" 2>/dev/null | tail -1 || true)
          echo "user update.log: $LAST"
          grep -qE ' exit 0 nothing$' <<< "$LAST" || fail "$DATA/update.log: no 'exit 0 nothing' entry from the user run"

          # Best effort: the outcome also goes to syslog (logger -t seashell).
          LOG=$( (sudo journalctl -t seashell --since "@$START" --no-pager -q 2>/dev/null || true; \
                  sudo grep -h 'seashell' /var/log/messages /var/log/syslog 2>/dev/null || true) | grep -i 'up to date' || true)
          if [ -n "$LOG" ]; then echo "syslog:"; echo "$LOG"; else echo "NOTICE: no 'up to date' syslog entry found on this runner (not asserted)"; fi

          "$SEASHELL" update --auto off || fail "update --auto off exited $?"
          [ -z "$(user_lines)" ] || fail "user crontab still has the '$TAG' line"
          [ -z "$(root_lines)" ] || fail "root crontab still has the '$TAG' line"
          STATUS=$("$SEASHELL" status 2>&1) || true
          echo "$STATUS"
          grep -qE 'Auto-update +off' <<< "$STATUS" || fail "seashell status does not show automatic updates off"
          exit $FAILED

      - name: "Install test: uninstall leaves nothing behind (Windows)"
        if: matrix.os == 'windows'
        shell: powershell
        run: |
          $data = Join-Path $env:LOCALAPPDATA 'seashell'
          $sysData = Join-Path $env:SystemRoot 'System32\config\systemprofile\AppData\Local\seashell'
          $seashell = Join-Path $data 'current\bin\seashell.exe'
          $failed = $false
          function Fail($m) { Write-Host "FAIL: $m"; $script:failed = $true }

          & $seashell uninstall
          if ($LASTEXITCODE -ne 0) { Fail "seashell uninstall exited $LASTEXITCODE" }

          # The installed copy uninstalls from a temporary copy of itself; its
          # own version directory goes once it has exited (a hidden helper).
          for ($i = 0; $i -lt 30; $i++) {
            if (-not (Get-ChildItem -LiteralPath $data -Directory -Filter 'v*' -ErrorAction SilentlyContinue)) { break }
            Start-Sleep -Seconds 1
          }
          foreach ($dir in $data, $sysData) {
            if (-not (Test-Path -LiteralPath $dir)) { Write-Host "OK: $dir is gone"; continue }
            $all = @(Get-ChildItem -LiteralPath $dir -Force | ForEach-Object { $_.Name })
            Write-Host "$dir still holds: $($all -join ', ')"
            $left = @($all | Where-Object { $_ -match '^v\d' -or $_ -eq 'current' -or $_ -eq 'install.scope' })
            if ($left) { Fail "$dir still has: $($left -join ', ')" }
          }

          # Daemon, elevator and update tasks of the runner account and SYSTEM.
          # Scheduled scripts are kept on purpose (no --purge).
          $pattern = '^SeaShell (Daemon|Elevator|Update) \((' + [regex]::Escape($env:USERNAME) + '|SYSTEM)\)'
          $tasks = @(Get-ScheduledTask -TaskPath '\SeaShell\' -ErrorAction SilentlyContinue | ForEach-Object { $_.TaskName })
          Write-Host "\SeaShell\ tasks left: $($tasks -join ', ')"
          $ours = @($tasks | Where-Object { $_ -match $pattern })
          if ($ours) { Fail "tasks left: $($ours -join ', ')" }

          # User PATH: no current\bin entry, and the value kept its registry kind.
          $key = [Microsoft.Win32.Registry]::CurrentUser.OpenSubKey('Environment')
          $name = if ($key) { $key.GetValueNames() | Where-Object { $_ -eq 'Path' } | Select-Object -First 1 }
          $raw = if ($name) { $key.GetValue($name, '', [Microsoft.Win32.RegistryValueOptions]::DoNotExpandEnvironmentNames) } else { '' }
          $kind = if ($name) { $key.GetValueKind($name).ToString() } else { 'None' }
          $entries = @($raw -split ';' | Where-Object { $_ })
          $stale = @($entries | Where-Object { [Environment]::ExpandEnvironmentVariables($_).Replace('/', '\').TrimEnd('\') -like '*\seashell\current\bin' })
          if ($stale) { Fail "user PATH still contains: $($stale -join '; ')" } else { Write-Host "OK: no seashell\current\bin in the user PATH" }
          Write-Host "HKCU\Environment\Path kind: $kind (before this build's first install: $env:USER_PATH_KIND)"
          if ($env:USER_PATH_KIND -and $env:USER_PATH_KIND -ne 'None' -and $kind -ne $env:USER_PATH_KIND) {
            Fail "user PATH value kind changed from $env:USER_PATH_KIND to $kind"
          }
          if ($failed) { exit 1 }

      - name: "Install test: uninstall leaves nothing behind (Linux)"
        if: matrix.os == 'linux'

        run: |
          DATA="${XDG_DATA_HOME:-$HOME/.local/share}/seashell"
          SEASHELL="$DATA/current/bin/seashell"
          TAG='# seashell-auto-update'
          FAILED=0
          fail() { echo "FAIL: $*"; FAILED=1; }

          CODE=0
          "$SEASHELL" uninstall || CODE=$?
          [ "$CODE" -eq 0 ] || fail "seashell uninstall exited $CODE"

          # $3: "sudo" for root's data dir.
          check_dir() {
            local left
            left=$($3 ls -A "$2" 2>/dev/null | grep -E '^(v[0-9].*|current|install\.scope)$' || true)
            if [ -n "$left" ]; then fail "$1 data dir $2 still has: $(echo $left)"
            else echo "OK: $1: no version dirs, current or install.scope in $2"; fi
          }
          check_dir user "$DATA" ""
          check_dir root /var/lib/seashell sudo

          for f in "$HOME/.local/bin/sea" "$HOME/.local/bin/seashell"; do
            if [ -e "$f" ] || [ -L "$f" ]; then fail "$f still exists"; fi
          done
          for f in /root/.local/bin/sea /root/.local/bin/seashell; do
            if sudo test -e "$f" || sudo test -L "$f"; then fail "$f still exists"; fi
          done
          if grep -qF "$TAG" <<< "$(crontab -l 2>/dev/null || true)"; then fail "user crontab has a '$TAG' line"; fi
          if grep -qF "$TAG" <<< "$(sudo crontab -l 2>/dev/null || true)"; then fail "root crontab has a '$TAG' line"; fi
          [ "$FAILED" -ne 0 ] || echo "OK: nothing left"
          exit $FAILED

      # ── Phase 4: Final verification ────────────────────────────────
      # Leave the machine with a clean, working SeaShell install of this
      # build, everything (user + elevator + SYSTEM / user + root).
      #
      # The cleanup runs also after a failed or cancelled step (always()), so
      # a failed job leaves no test service, daemon or task of its own behind.
      # The reinstall and its checks run only after a passing job: a failed
      # job's runner is wiped and reinstalled by the next job's Install phase.

      - name: "Final: Clean up test services (Windows)"
        if: always() && matrix.os == 'windows'
        shell: powershell
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Continue'
          # The service test's service, left when that test failed half-way.
          if (Get-Service 'seashell-cwd-test' -ErrorAction SilentlyContinue) {
            sc.exe stop seashell-cwd-test | Out-Null
            Start-Sleep -Seconds 3
            sc.exe delete seashell-cwd-test
          }
          & ([scriptblock]::Create($env:SEASHELL_CI_CLEANUP_PS1)) -Apply -Tasks
          exit 0

      - name: "Final: Clean up test services (Linux)"
        if: always() && matrix.os == 'linux'

        continue-on-error: true
        run: |
          # The service test's service and account, left when that test failed half-way.
          EXE=./artifacts/service-cwd-test/ServiceCwdTest
          if [ -x "$EXE" ]; then
            sudo "$EXE" stop 2>/dev/null || true
            sleep 2
            sudo "$EXE" uninstall 2>/dev/null || true
          fi
          if id seashell-test-user >/dev/null 2>&1; then
            sudo userdel seashell-test-user 2>/dev/null || sudo deluser seashell-test-user 2>/dev/null || true
            sudo delgroup seashell-test-user 2>/dev/null || true
          fi
          printf '%s\n' "$SEASHELL_CI_CLEANUP_SH" | sudo bash -s -- apply "$(id -u)" "$(id -un)" "${XDG_DATA_HOME:-$HOME/.local/share}/seashell" \
            "$GITHUB_WORKSPACE" "${TMPDIR:-/tmp}" "${RUNNER_TEMP:-}"

      # After the uninstall test there is no install and no install.scope:
      # --all, from the global tool (it carries the archives; ~/.dotnet/tools
      # is not on the job PATH, hence the full path).
      - name: "Final: Clean reinstall"

        run: |
          VERSION="${{ needs.version.outputs.version }}"
          if [ "${{ matrix.os }}" = "windows" ]; then
            TOOL="$(cygpath -u "$USERPROFILE")/.dotnet/tools/seashell.exe"
            FEED="$(cygpath -m "$(pwd)/nupkg")"
          else
            TOOL="$HOME/.dotnet/tools/seashell"
            FEED="$(pwd)/nupkg"
          fi
          dotnet tool uninstall -g SeaShell 2>/dev/null || true
          dotnet tool install -g SeaShell --version "$VERSION" --source "$FEED"
          "$TOOL" install --all

      - name: "Final: Verify sea --version"
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          OUT=$(sea --version | tr -d '\r')
          echo "$OUT"
          [ "$OUT" = "{~} SeaShell v$VERSION" ] || { echo "FAIL: expected {~} SeaShell v$VERSION"; exit 1; }

      - name: "Final: Start daemon and verify status"

        run: |
          sea --daemon-start
          sleep 3
          sea --status

      - name: "Final: Smoke test (hello.cs)"
        run: sea test/hello.cs

  # ── Release ──────────────────────────────────────────────────────────
  # On master: publish packages to nuget.org after successful tests.

  release:
    needs: [version, test]
    if: github.ref == 'refs/heads/master'
    runs-on: linux-x64

    steps:
      - name: Download packages
        uses: http://gitea:3000/actions/download-artifact@v3
        with:
          name: packages
          path: nupkg/

      - name: Publish to nuget.org
        run: |
          for pkg in nupkg/*.nupkg; do
            echo "Publishing $(basename "$pkg") to nuget.org..."
            dotnet nuget push "$pkg" \
              --source https://api.nuget.org/v3/index.json \
              --api-key "${{ secrets.NUGET_API_KEY }}" \
              --skip-duplicate
          done
